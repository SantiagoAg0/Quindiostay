server:
  port: 8080

spring:
  application:
    name: quindiostay
  profiles:
    default: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  jackson:
    time-zone: America/Bogota

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:QuindioStay2024SecretoDesarrolloSeguro32chars!}
    expiracion-minutos: ${JWT_EXPIRACION:120}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200}
